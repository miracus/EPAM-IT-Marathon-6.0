<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green &amp; Tasty — Group Cart v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --g900:#0B4F22; --g700:#0E6B2E; --g600:#14853A; --g500:#1FA34A; --g100:#DDF2E3; --g50:#F1F9F3;
  --ink:#232323; --ink2:#5C5C5C; --muted:#8F8F8F; --line:#EDEDED; --soft:#F6F6F4;
  --red:#D93B3B; --red50:#FDEEEE; --amber:#8A5800; --amber50:#FFF6E5; --amberLine:#F3DDAE;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:#e9ebe8;font-size:13px;line-height:1.45}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

.frame{width:1440px;height:1013px;position:relative;overflow:hidden;background:#fff;margin:0 auto}
.page{position:absolute;inset:0}
.nav{height:64px;display:flex;align-items:center;padding:0 48px;gap:48px;border-bottom:1px solid var(--line)}
.logo{font-weight:600;color:var(--g700);font-size:18px}
.logo span{color:var(--g500)}
.nav a{color:var(--ink2);font-size:14px}
.nav a.on{color:var(--g700)}
.strip{background:var(--g100);color:var(--g900);text-align:center;padding:9px;font-size:13px}
.crumbs{padding:14px 48px;color:var(--muted);font-size:12px}
.hero{margin:0 48px;height:150px;border-radius:16px;background:linear-gradient(100deg,#eef7ef,#e4efe2 55%,#cfe2c8);padding:34px 40px}
.hero small{color:var(--g700);font-weight:500;font-size:14px}
.hero h1{font-size:40px;font-weight:500;margin-top:4px}
.tabs-page{display:flex;gap:36px;margin:26px 48px 0;border-bottom:1px solid var(--line);font-size:14px}
.tabs-page span{padding-bottom:10px;color:var(--ink2)}
.tabs-page span.on{color:var(--g700);border-bottom:2px solid var(--g700)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin:24px 48px}
.card{background:var(--soft);border-radius:16px;height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.card svg{width:120px;height:120px}
.card b{font-weight:500;font-size:13px}
.scrim{position:absolute;inset:0;background:rgba(30,40,30,.38)}

.drawer{position:absolute;top:0;right:0;bottom:0;width:480px;background:#fff;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.12)}
.d-head{padding:18px 24px 14px;border-bottom:1px solid var(--line)}
.d-top{display:flex;align-items:center;justify-content:space-between}
.d-top h2{font-size:18px;font-weight:500}
.x{width:24px;height:24px;color:var(--muted)}
.ctx{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--muted);font-size:12px}
.ctx .grow{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-body{flex:1;overflow:auto;padding:14px 24px 8px}
.d-foot{border-top:1px solid var(--line);padding:12px 24px 22px}

.link{display:inline-flex;align-items:center;gap:5px;color:var(--g700);font-weight:500;font-size:12px;white-space:nowrap;border-radius:6px;padding:3px 6px;margin:-3px -6px}
.link:hover{background:var(--g50)}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:var(--g50);color:var(--g700);font-size:12px;font-weight:500;white-space:nowrap}
.pill-btn:hover{background:var(--g100)}

.progress-row{display:flex;align-items:center;gap:10px}
.stack{display:flex}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;border:2px solid #fff;flex:none}
.av svg{display:block}
.stack .av+.av{margin-left:-7px}
.av.empty{background:#fff;border:1.5px dashed #C9C9C9;color:var(--muted)}
.progress-row .txt{flex:1;font-size:12px;color:var(--ink2)}
.progress-row .txt b{color:var(--ink);font-weight:500}

.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;margin:12px 0 10px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:12px;font-weight:500;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .n{color:var(--muted);font-weight:400;margin-left:4px}

.alert{display:flex;gap:8px;align-items:center;background:var(--amber50);border:1px solid var(--amberLine);color:var(--amber);border-radius:9px;padding:8px 12px;font-size:12px;margin-bottom:6px}
.alert .grow{flex:1}
.alert .link{color:var(--amber)}
.alert .link:hover{background:#fdebc8}

.person{padding:10px 0 6px;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.p-head{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.p-head .nm{flex:1;min-width:0;display:flex;align-items:center;gap:8px;white-space:nowrap}
.p-head .nm b{font-weight:500;font-size:13px}
.badge{font-size:10px;font-weight:500;padding:1px 7px;border-radius:20px;background:var(--g100);color:var(--g900)}
.p-head .sum{font-weight:600;font-size:13px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.st i{width:6px;height:6px;border-radius:50%;background:var(--g500)}
.st.warn i{background:#E0A100}
.st.wait i{background:#C9C9C9}

.line{display:flex;align-items:center;gap:10px;padding:5px 0 5px 36px;min-height:40px}
.thumb{width:30px;height:30px;flex:none}
.line .nm{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{min-width:28px;height:22px;border-radius:6px;background:var(--soft);font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.line .lt{font-weight:500;font-size:13px;min-width:38px;text-align:right}
.line.na .nm,.line.na .lt{color:var(--muted)}
.line.na .lt{text-decoration:line-through}
.line.na .thumb{filter:grayscale(1);opacity:.5}
.tag-na{font-size:10px;font-weight:500;color:var(--red);background:var(--red50);padding:1px 6px;border-radius:4px;margin-left:6px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;height:26px;flex:none}
.step button{width:24px;height:24px;color:var(--ink2);font-size:14px;line-height:1}
.step button:hover{color:var(--g700)}
.step span{min-width:16px;text-align:center;font-size:12px;font-weight:500}
.line .del{color:#c4c4c4;width:22px;height:22px;display:grid;place-items:center;flex:none}
.line .del:hover{color:var(--red)}
.line.empty{color:var(--muted);font-size:12px;min-height:30px}
.who{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pending{display:flex;align-items:center;gap:10px;padding:12px 0 4px;color:var(--ink2);font-size:12px}
.pending .grow{flex:1}
.hint{font-size:11px;color:var(--muted);margin:2px 0 2px}

.f-break{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:11px;margin-bottom:10px}
.f-break b{color:var(--ink2);font-weight:500}
.f-break .live{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.f-break .live i{width:6px;height:6px;border-radius:50%;background:var(--g500);box-shadow:0 0 0 3px var(--g100)}
.f-main{display:flex;align-items:center;gap:16px}
.f-main .tot{flex:1}
.f-main .tot span{display:block;font-size:12px;color:var(--ink2)}
.f-main .tot b{font-size:24px;font-weight:600;color:var(--g700);line-height:1.1}
.primary{height:48px;padding:0 26px;border-radius:10px;background:linear-gradient(90deg,var(--g700),var(--g600));color:#fff;font-weight:500;font-size:14px;min-width:220px}
.primary:hover{filter:brightness(1.08)}

.empty{text-align:center;padding:26px 10px 8px}
.empty h3{font-size:15px;font-weight:500;margin:12px 0 4px}
.empty p{color:var(--muted);font-size:12px;max-width:300px;margin:0 auto}
.empty .pill-btn{margin-top:16px;height:38px;padding:0 18px;border-radius:19px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--g50);border-radius:9px;padding:10px 12px;color:var(--g900);font-size:12px;margin-bottom:10px}
.sec{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 2px}

.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(16px);background:#1f2a22;color:#fff;font-size:12px;padding:9px 14px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;display:flex;gap:12px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}

.switch{position:fixed;left:16px;top:16px;background:#fff;border-radius:12px;padding:10px;box-shadow:0 4px 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:4px;z-index:9;width:210px}
.switch p{font-size:11px;color:var(--muted);padding:0 6px 4px}
.switch a{font-size:12px;color:var(--ink2);text-decoration:none;padding:6px 8px;border-radius:6px}
.switch a.on{background:var(--g50);color:var(--g700);font-weight:500}
body.export .switch{display:none}
@media (max-width:1700px){body:not(.export) .frame{transform:scale(.8);transform-origin:top center;margin-bottom:-200px}}

/* ---------- v3 additions ---------- */
.cutoff{display:flex;align-items:center;gap:8px;margin-top:10px;padding:7px 10px;border-radius:9px;background:var(--soft);font-size:12px;color:var(--ink2)}
.cutoff .grow{flex:1}
.cutoff b{font-weight:500;color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.toggle i{width:26px;height:15px;border-radius:8px;background:var(--g500);position:relative;display:inline-block}
.toggle i::after{content:"";position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#fff}
.toggle.off i{background:#cfcfcf}.toggle.off i::after{right:auto;left:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:500;padding:1px 7px;border-radius:20px;white-space:nowrap}
.chip.allergy{background:#FDEEEE;color:#B42828}
.chip.serve{background:#EEF3FB;color:#2E5AA8}
.chip.changed{background:var(--soft);color:var(--ink2)}
.note{display:block;font-size:11px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note::before{content:"“";color:var(--muted)}.note::after{content:"”";color:var(--muted)}
.line .nm2{flex:1;min-width:0}
.line .nm2 .t{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.line .nm2 .t span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line.new{background:linear-gradient(90deg,rgba(31,163,74,.10),rgba(31,163,74,0) 70%);border-radius:8px}
.newtag{font-size:10px;font-weight:600;color:var(--g700);background:var(--g100);padding:0 6px;border-radius:4px}
.gdel{color:#c9c9c9;width:22px;height:22px;display:grid;place-items:center;flex:none;border-radius:6px}
.gdel:hover{color:var(--red);background:var(--red50)}
.undo-row{display:flex;align-items:center;gap:10px;margin:2px 0 2px 36px;padding:7px 10px;border-radius:8px;background:var(--soft);font-size:12px;color:var(--ink2)}
.undo-row .grow{flex:1}
.morewrap{position:relative;flex:none}
.more{width:24px;height:24px;border-radius:6px;color:var(--muted);display:grid;place-items:center;position:relative}
.more:hover,.more.on{background:var(--soft);color:var(--ink)}
.menu{position:absolute;right:0;top:28px;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:6px;width:190px;z-index:3;text-align:left}
.menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:7px;font-size:12px;color:var(--ink)}
.menu button:hover{background:var(--soft)}
.menu button.danger{color:var(--red)}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:12px;font-size:12px;margin-bottom:12px}
.banner.info{background:#EEF3FB;color:#1F3F78}
.banner.ok{background:var(--g50);color:var(--g900)}
.banner b{font-weight:500}
.banner .acts{display:flex;gap:14px;margin-top:8px}
.banner .acts .link{color:inherit}
.lockico{color:var(--muted);flex:none}
.pay-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.pay-row .grow{flex:1}
.pay-row .grow small{display:block;color:var(--muted);font-size:11px}
.paid{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.paid.yes{background:var(--g50);color:var(--g700)}
.paid.no{background:var(--soft);color:var(--ink2)}
.course{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 2px;display:flex;align-items:center;gap:8px}
.course::after{content:"";flex:1;height:1px;background:var(--line)}
.kitchen-alert{display:flex;gap:8px;align-items:center;background:#FDEEEE;color:#B42828;border-radius:9px;padding:8px 12px;font-size:12px;margin:6px 0}
.addnote{font-size:11px;color:var(--g700);font-weight:500}
.select{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border:1px solid var(--line);border-radius:7px;font-size:11px;color:var(--ink2)}
.field{display:flex;align-items:center;gap:6px;margin-top:6px;height:30px;border:1px solid var(--g500);border-radius:8px;padding:0 10px;font-size:12px;color:var(--ink);background:#fff;box-shadow:0 0 0 3px var(--g100)}
.summary{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;text-align:left}
.summary .row2{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:3px 0}
.summary .row2 b{color:var(--ink);font-weight:500}
.secondary{white-space:nowrap;flex:none;height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);font-weight:500;font-size:13px;color:var(--ink)}
.notif{position:absolute;right:500px;top:20px;width:340px;background:#fff;border-radius:14px;box-shadow:0 10px 36px rgba(0,0,0,.22);padding:14px;display:flex;gap:12px;z-index:5}
.notif .ico{width:36px;height:36px;border-radius:10px;background:var(--g700);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.notif b{font-weight:500;font-size:13px}.notif p{font-size:12px;color:var(--ink2)}
.notif small{color:var(--muted);font-size:11px}
</style>
</head>
<body>
<nav class="switch" id="switch"></nav>

<div class="frame">
  <div class="page">
    <div class="nav"><div class="logo">Green<span>&amp;</span>Tasty</div><a class="on">Main page</a><a>Book a Table</a></div>
    <div class="strip">You are making a pre-order for the reservation at Green &amp; Tasty, Downtown · Fri, 24 Oct, 19:00</div>
    <div class="crumbs">Main page &nbsp;›&nbsp; Menu</div>
    <div class="hero"><small>Green &amp; Tasty Restaurants</small><h1>Menu</h1></div>
    <div class="tabs-page"><span class="on">Appetizers</span><span>Main Courses</span><span>Desserts</span></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="scrim"></div>
  <div id="extra"></div>
  <aside class="drawer" id="drawer"></aside>
  <div class="toast" id="toast"></div>
</div>

<script>
if(new URLSearchParams(location.search).has('export')) document.body.classList.add('export');

/* ================= data ================= */
const DISH = {
  straw:  {n:'Fresh Strawberry Mint Salad', p:17, c:['#2f7a3a','#d8343f','#7cc36b']},
  potato: {n:'Roasted Sweet Potato & Lentil Salad', p:10, c:['#d98b2b','#6c8f3a','#b9733c']},
  aspar:  {n:'Green Asparagus Salad', p:12, c:['#9bc46b','#cfe3a4','#7aa84a'], na:true},
  quinoa: {n:'Quinoa Bowl with Avocado', p:15, c:['#e9d6a8','#5f9e4b','#c49a5a']},
  berry:  {n:'Berry Yogurt Parfait', p:9, c:['#c9334f','#f4e7e1','#7f2a6e'], course:'after'},
};
const fresh = () => ({
  OWNER: {id:'me', name:'Oleh', color:'#0E6B2E', items:[{d:'straw',q:1},{d:'potato',q:1}]},
  GUESTS: [
    {id:'anna', name:'Anna Koval', color:'#3D7BD9', time:'15:12', items:[{d:'straw',q:2},{d:'quinoa',q:1,note:'No onion, dressing on the side',isNew:true}]},
    {id:'max', name:'Maksym Bondar', color:'#C26A1B', time:'15:31', allergy:'Nut allergy', items:[{d:'potato',q:1},{d:'aspar',q:1},{d:'berry',q:1,serve:'After mains'}]},
    {id:'iryna', name:'Iryna Shevchuk', color:'#8E4FC4', time:null, items:[]},
  ],
});
let S = fresh();
const TOTAL = 5;

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const money = v => '$' + v;
const first = n => n.split(' ')[0];
const plate = ([a,b,c]) => `<svg class="thumb" viewBox="0 0 56 56"><circle cx="28" cy="28" r="27" fill="#f3f1ec"/><circle cx="28" cy="28" r="21" fill="#fff" stroke="#ebe8e1"/><circle cx="22" cy="24" r="8" fill="${a}"/><circle cx="34" cy="22" r="6" fill="${b}"/><circle cx="31" cy="34" r="8" fill="${c}"/><circle cx="20" cy="34" r="4" fill="${b}"/></svg>`;
const I = {
  x:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  link:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>`,
  bell:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 004 0"/></svg>`,
  warn:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>`,
  trash:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>`,
  plus:`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>`,
  info:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>`,
  timer:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>`,
  lock:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>`,
  check:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>`,
  dots:`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>`,
  edit:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>`,
  user:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>`,
  repeat:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/></svg>`,
  people:`<svg width="44" height="44" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="23" fill="#F1F9F3"/><circle cx="19" cy="20" r="5" stroke="#14853A" stroke-width="2"/><path d="M10 34c1.5-5 5-7 9-7s7.5 2 9 7" stroke="#14853A" stroke-width="2"/><circle cx="31" cy="19" r="4" stroke="#14853A" stroke-width="2" stroke-dasharray="3 2"/><path d="M30 26c4 0 7 2 8 6" stroke="#14853A" stroke-width="2" stroke-dasharray="3 2"/></svg>`,
  done:`<svg width="44" height="44" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="23" fill="#F1F9F3"/><path d="M16 24l6 6 11-12" stroke="#14853A" stroke-width="2.4"/></svg>`,
};
const sum = items => items.reduce((s,i)=> s + (DISH[i.d].na||i.removed ? 0 : DISH[i.d].p*i.q), 0);
let toastT;
function toast(t){const el=$('#toast');el.innerHTML=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2400)}
$('#grid').innerHTML = ['straw','aspar','potato','quinoa','berry','straw','potato','quinoa'].map(k=>`<div class="card">${plate(DISH[k].c)}<b>${DISH[k].n}</b></div>`).join('');

/* ================= blocks ================= */
const head = (ctx, invite=true) => `<div class="d-head"><div class="d-top"><h2>Cart</h2><button class="x" aria-label="Close">${I.x}</button></div>
  <div class="ctx"><span class="grow">${ctx}</span>${invite?`<button class="link" data-act="copy">${I.link} Copy invite link</button>`:''}</div></div>`;
const CTX = `Downtown · Fri, 24 Oct, 19:00 · Table 4 · ${TOTAL} guests`;

function progress(guests, {remind=true}={}){
  const all=[S.OWNER,...guests], joined=all.length, chose=all.filter(p=>p.items.length).length;
  const waiting = guests.filter(g=>!g.items.length);
  const av = all.map(p=>`<div class="av" style="background:${p.color}" title="${p.name}">${p.name[0]}</div>`).join('')
           + Array(TOTAL-joined).fill(`<div class="av empty">${I.plus}</div>`).join('');
  const action = remind && waiting.length ? `<button class="pill-btn" data-act="remind" data-n="${waiting.map(w=>first(w.name)).join(', ')}">${I.bell} Remind ${waiting.length}</button>` : '';
  return `<div class="progress-row"><div class="stack">${av}</div><div class="txt"><b>${joined} of ${TOTAL} joined</b> · ${chose} chose dishes</div>${action}</div>`;
}
const cutoff = (auto=true) => `<div class="cutoff">${I.timer}<span class="grow">Changes close at <b>17:00</b> · in 1h 20m</span>
  <button class="toggle ${auto?'':'off'}" data-act="auto" title="Remind everyone who hasn’t chosen 30 min before cut-off"><i></i>Auto-remind</button></div>`;
const dishKinds = guests => new Set([S.OWNER,...guests].flatMap(p=>p.items.filter(i=>!i.removed).map(i=>i.d))).size;
const seg = (view, n) => `<div class="seg"><button data-view="guest" class="${view==='guest'?'on':''}">By guest</button><button data-view="dish" class="${view==='dish'?'on':''}">By dish<span class="n">${n}</span></button></div>`;
function naAlert(guests){
  const who = guests.filter(g=>g.items.some(i=>DISH[i.d].na && !i.removed));
  if(!who.length) return '';
  return `<div class="alert">${I.warn}<span class="grow">Some dishes are unavailable and not counted.</span><button class="link" data-act="ask" data-n="${who.map(w=>first(w.name)).join(', ')}">Ask to replace</button></div>`;
}
function nameCell(d, it){
  const chips = (DISH[it.d].na?'<span class="tag-na" style="margin-left:0">Unavailable</span>':'')
    + (it.serve?`<span class="chip serve">${it.serve}</span>`:'')
    + (it.isNew&&MODE.live?'<span class="newtag">NEW</span>':'');
  return `<span class="nm2"><span class="t"><span class="n">${d.n}</span>${chips}</span>${it.note?`<span class="note">${it.note}</span>`:''}</span>`;
}
function ownerSection(locked){
  const lines = S.OWNER.items.map((it,ix)=>{const d=DISH[it.d];return `
    <div class="line">${plate(d.c)}${nameCell(d,it)}
      ${locked?`<span class="qty">×${it.q}</span>`:`<span class="step"><button data-dec="${ix}">−</button><span>${it.q}</span><button data-inc="${ix}">+</button></span>`}
      <span class="lt">${money(d.p*it.q)}</span>${locked?'':`<button class="del" data-del="${ix}" aria-label="Remove">${I.trash}</button>`}</div>`}).join('');
  return `<div class="person"><div class="p-head"><div class="av" style="background:${S.OWNER.color}">${S.OWNER.name[0]}</div>
    <div class="nm"><b>You</b><span class="badge">Organizer</span></div><span class="sum">${money(sum(S.OWNER.items))}</span></div>${lines}</div>`;
}
function guestSection(g, opts={}){
  const hasNA = g.items.some(i=>DISH[i.d].na && !i.removed);
  const changed = g.items.some(i=>i.removed);
  const st = !g.items.length ? `<span class="st wait"><i></i>Choosing…</span>`
           : changed ? `<span class="chip changed">${I.edit} Changed by you</span>`
           : hasNA ? `<span class="st warn"><i></i>Needs a swap</span>`
           : `<span class="st"><i></i>Ready · ${g.time}</span>`;
  const allergy = g.allergy ? `<span class="chip allergy">${g.allergy}</span>` : '';
  const menu = opts.menuFor===g.id ? `<div class="menu"><button data-act="remind" data-n="${first(g.name)}">${I.bell} Remind ${first(g.name)}</button><button>${I.edit} Ask to change order</button><button class="danger" data-act="rmguest" data-g="${g.id}">${I.user} Remove from group</button></div>` : '';
  const more = opts.locked ? '' : `<span class="morewrap"><button class="more ${opts.menuFor===g.id?'on':''}" data-menu="${g.id}" aria-label="More">${I.dots}</button>${menu}</span>`;
  if(!g.items.length){
    return `<div class="person"><div class="p-head"><div class="av" style="background:${g.color}">${g.name[0]}</div>
      <div class="nm"><b>${g.name}</b>${st}</div>${opts.locked?'':`<button class="link" data-act="remind" data-n="${first(g.name)}">${I.bell} Remind</button>`}${more}</div></div>`;
  }
  const lines = g.items.map((it,ix)=>{const d=DISH[it.d];
    if(it.removed) return `<div class="undo-row">${I.trash}<span class="grow">${d.n} removed — ${first(g.name)} will be notified</span><button class="link" data-undo-g="${g.id}" data-ix="${ix}">Undo</button></div>`;
    return `<div class="line ${d.na?'na':''} ${it.isNew&&MODE.live?'new':''}">${plate(d.c)}${nameCell(d,it)}
      <span class="qty">×${it.q}</span><span class="lt">${money(d.p*it.q)}</span>
      ${opts.locked?`<span class="lockico">${I.lock}</span>`:`<button class="gdel" data-gdel="${g.id}" data-ix="${ix}" title="Remove from ${first(g.name)}’s order">${I.trash}</button>`}</div>`}).join('');
  return `<div class="person"><div class="p-head"><div class="av" style="background:${g.color}">${g.name[0]}</div>
    <div class="nm"><b>${g.name}</b>${allergy}${st}</div><span class="sum">${money(sum(g.items))}</span>${more}</div>${lines}</div>`;
}
function pending(guests){
  const left = TOTAL-1-guests.length; if(left<=0) return '';
  return `<div class="pending"><div class="av empty">${I.plus}</div><span class="grow">${left} more invited · not joined yet</span><button class="link" data-act="copy">${I.link} Copy link</button></div>`;
}
function byDish(guests){
  const map={};
  [S.OWNER,...guests].forEach(p=>p.items.filter(i=>!i.removed).forEach(it=>{
    const k = it.d; (map[k] ||= {q:0,who:[],notes:[]}); map[k].q+=it.q;
    map[k].who.push((p.id==='me'?'You':first(p.name))+(it.q>1?' ×'+it.q:''));
    if(it.note) map[k].notes.push(`${first(p.name)}: ${it.note}`);
  }));
  const row = ([k,v]) => {const d=DISH[k]; return `<div class="line ${d.na?'na':''}" style="padding-left:0;min-height:48px">${plate(d.c)}
      <span class="nm2"><span class="t"><span class="n">${d.n}</span>${d.na?'<span class="tag-na" style="margin-left:0">Unavailable</span>':''}</span>
      <span class="who">${v.who.join(' · ')}</span>${v.notes.map(n=>`<span class="note">${n}</span>`).join('')}</span>
      <span class="qty">×${v.q}</span><span class="lt">${money(d.p*v.q)}</span></div>`};
  const entries = Object.entries(map).sort((a,b)=>(DISH[a[0]].na-DISH[b[0]].na)||b[1].q-a[1].q);
  const allergies = guests.filter(g=>g.allergy);
  return `<p class="hint">Exactly what the kitchen will cook — grouped by serving time.</p>`
    + allergies.map(g=>`<div class="kitchen-alert">${I.warn}<span><b style="font-weight:500">${g.allergy}</b> — ${first(g.name)}. Kitchen will be warned.</span></div>`).join('')
    + `<div class="course">On arrival</div>` + entries.filter(([k])=>DISH[k].course!=='after').map(row).join('')
    + `<div class="course">After mains</div>` + entries.filter(([k])=>DISH[k].course==='after').map(row).join('');
}
function footer(guests, {cta='Submit Pre-Order', live=true, ctaAct='submit', secondary=''}={}){
  const mine=sum(S.OWNER.items), theirs=guests.reduce((s,g)=>s+sum(g.items),0);
  return `<div class="d-foot"><div class="f-break"><span>You <b>${money(mine)}</b></span><span>Guests <b>${money(theirs)}</b></span>
      ${live?`<span class="live"><i></i>Live · updated 15:40</span>`:`<span class="live">${I.lock} Locked</span>`}</div>
    <div class="f-main"><div class="tot"><span>Grand Total</span><b>${money(mine+theirs)}</b></div>${secondary}<button class="primary" data-act="${ctaAct}">${cta}</button></div></div>`;
}

/* ================= screens ================= */
let view='guest', menuFor=null;
const MODE = {live:true};
const SCREENS = {
  main:{label:'01 · Owner — by guest', render(){
    const g=S.GUESTS;
    return head(CTX) + `<div class="d-body">${progress(g)}${cutoff()}${seg(view,dishKinds(g))}${naAlert(g)}
      ${view==='guest' ? ownerSection()+g.map(x=>guestSection(x,{menuFor})).join('')+pending(g) : byDish(g)}</div>` + footer(g);
  }},
  dish:{label:'02 · Owner — by dish (kitchen)', init(){view='dish'}, render(){ return SCREENS.main.render(); }},
  edit:{label:'03 · Owner edits a guest order', init(){ S.GUESTS[0].items[1].removed=true; S.GUESTS[0].items[1].isNew=false; menuFor='max'; }, render(){ return SCREENS.main.render(); }},
  guestchg:{label:'04 · Guest sees the change', render(){
    const me=S.GUESTS[0];
    const lines=me.items.map((it,ix)=>{const d=DISH[it.d];
      if(it.removed) return `<div class="line na" style="padding-left:0">${plate(d.c)}<span class="nm2"><span class="t"><span class="n" style="text-decoration:line-through">${d.n}</span><span class="chip changed">Removed by Oleh</span></span></span><span class="lt">${money(d.p*it.q)}</span></div>`;
      return `<div class="line" style="padding-left:0">${plate(d.c)}${nameCell(d,it)}<span class="step"><button>−</button><span>${it.q}</span><button>+</button></span><span class="lt">${money(d.p*it.q)}</span><button class="del">${I.trash}</button></div>`}).join('');
    $('#extra').innerHTML = `<div class="notif"><div class="ico">G&amp;T</div><div><b>Your pre-order was changed</b><p>Oleh removed Quinoa Bowl with Avocado from your order for Fri, 24 Oct.</p><small>Green &amp; Tasty · now</small></div></div>`;
    return `<div class="d-head"><div class="d-top"><h2>Cart</h2><button class="x">${I.x}</button></div><div class="ctx"><span class="grow">Oleh’s table · Downtown · Fri, 24 Oct, 19:00</span></div></div>
      <div class="d-body"><div class="banner info">${I.info}<div><b>Oleh removed Quinoa Bowl with Avocado from your order.</b><br>Your total changed from $49 to $34. Changes close at 17:00.
        <div class="acts"><button class="link" data-act="ok">OK, got it</button><button class="link" data-act="pick">Pick another dish</button></div></div></div>
      <div class="sec">My dishes · Anna</div>${lines}</div>
      <div class="d-foot"><div class="f-break"><span class="live" style="margin-left:0"><i></i>Saved automatically</span></div>
      <div class="f-main"><div class="tot"><span>My total</span><b>${money(sum(me.items))}</b></div><button class="primary">Back to menu</button></div></div>`;
  }, init(){ S.GUESTS[0].items[1].removed=true; }},
  guestnote:{label:'05 · Guest adds note & serving time', render(){
    const me=S.GUESTS[1];
    const lines=me.items.map((it,ix)=>{const d=DISH[it.d];
      const extra = ix===0 ? `<span class="field">Less spicy, please<span style="flex:1"></span><span style="color:var(--muted);font-size:11px">18/80</span></span>`
        : `<span style="display:flex;gap:10px;align-items:center;margin-top:4px"><button class="addnote">+ Add note</button><span class="select">Serve: ${it.serve||'On arrival'} ▾</span></span>`;
      return `<div class="line ${d.na?'na':''}" style="padding-left:0;align-items:flex-start">${plate(d.c)}<span class="nm2"><span class="t"><span class="n">${d.n}</span>${d.na?'<span class="tag-na" style="margin-left:0">Unavailable</span>':''}</span>${extra}</span>
        <span class="step"><button>−</button><span>${it.q}</span><button>+</button></span><span class="lt">${money(d.p*it.q)}</span></div>`}).join('');
    return `<div class="d-head"><div class="d-top"><h2>Cart</h2><button class="x">${I.x}</button></div><div class="ctx"><span class="grow">Oleh’s table · Downtown · Fri, 24 Oct, 19:00</span></div></div>
      <div class="d-body"><div class="notice">${I.info}<div>Your dishes go straight to Oleh’s group order — nothing to submit. Changes close at 17:00.</div></div>
      <div class="cutoff" style="margin:0 0 10px">${I.warn}<span class="grow">Allergies or dietary needs</span><span class="chip allergy">Nut allergy</span><button class="link">Edit</button></div>
      <div class="sec">My dishes · Maksym</div>${lines}</div>
      <div class="d-foot"><div class="f-break"><span class="live" style="margin-left:0"><i></i>Saved automatically</span></div>
      <div class="f-main"><div class="tot"><span>My total</span><b>${money(sum(me.items))}</b></div><button class="primary">Back to menu</button></div></div>`;
  }},
  locked:{label:'06 · Submitted & locked', init(){ MODE.live=false; S.GUESTS[2].items=[{d:'quinoa',q:1}]; S.GUESTS[2].time='16:05'; S.GUESTS[1].items=S.GUESTS[1].items.filter(i=>i.d!=='aspar'); S.GUESTS[1].items.push({d:'straw',q:1}); }, render(){
    const g=S.GUESTS;
    return head(CTX,false) + `<div class="d-body"><div class="banner ok">${I.check}<div><b>Sent to the restaurant at 16:58</b><br>The kitchen has your order. Changes are locked — to change something, call the restaurant.</div></div>
      ${progress(g,{remind:false})}<div style="height:8px"></div>${ownerSection(true)}${g.map(x=>guestSection(x,{locked:true})).join('')}</div>`
      + footer(g,{cta:'Choose how to pay', live:false, ctaAct:'pay'});
  }},
  pay:{label:'07 · Split the bill', init(){ MODE.live=false; S.GUESTS[2].items=[{d:'quinoa',q:1}]; S.GUESTS[1].items=S.GUESTS[1].items.filter(i=>i.d!=='aspar'); S.GUESTS[1].items.push({d:'straw',q:1}); }, render(){
    const all=[S.OWNER,...S.GUESTS]; const total=all.reduce((s,p)=>s+sum(p.items),0);
    const status={me:'yes',anna:'yes',max:'no',iryna:'no'};
    const rows = all.map(p=>`<div class="pay-row"><div class="av" style="background:${p.color}">${p.name[0]}</div><div class="grow"><b style="font-weight:500">${p.id==='me'?'You':p.name}</b><small>${p.items.reduce((s,i)=>s+i.q,0)} items</small></div>
      <span class="paid ${status[p.id]}">${status[p.id]==='yes'?'Paid':'Pending'}</span><b style="font-weight:600;min-width:44px;text-align:right">${money(sum(p.items))}</b></div>`).join('');
    return head(CTX,false) + `<div class="d-body"><div class="sec" style="margin-top:0">How do you want to pay?</div>
      <div class="seg" style="margin-top:6px"><button class="on">Each pays own</button><button>I pay for all</button><button>Split equally</button></div>
      <p class="hint" style="margin-bottom:6px">Everyone gets a payment link for their own dishes. 2 of 4 paid.</p>${rows}
      <div class="pending"><span class="grow">2 people haven’t paid yet</span><button class="pill-btn" data-act="remind" data-n="Maksym, Iryna">${I.bell} Remind 2</button></div></div>
      <div class="d-foot"><div class="f-break"><span>Paid <b>${money(sum(S.OWNER.items)+sum(S.GUESTS[0].items))}</b></span><span>Pending <b>${money(sum(S.GUESTS[1].items)+sum(S.GUESTS[2].items))}</b></span><span class="live">${I.lock} Order locked</span></div>
      <div class="f-main"><div class="tot"><span>Grand Total</span><b>${money(total)}</b></div><button class="primary" data-act="paylinks">Send payment links</button></div></div>`;
  }},
  empty:{label:'08 · No guests joined', render(){
    S.GUESTS=[];
    return head(CTX,false) + `<div class="d-body">${progress([])}${cutoff()}<div style="height:8px"></div>${ownerSection()}
      <div class="empty">${I.people}<h3>No guests have joined yet</h3><p>Send the link — friends add their dishes here, and you see everything in one place.</p>
      <button class="pill-btn" data-act="copy">${I.link} Copy invite link</button></div></div>` + footer([]);
  }},
  done:{label:'09 · Completed — book again', render(){
    return head(CTX,false) + `<div class="d-body"><div class="empty" style="padding-top:70px">${I.done}<h3>Hope you enjoyed the dinner!</h3>
      <p>This reservation is completed, so the pre-order is closed. Want to get the same group together again?</p>
      <div class="summary"><div class="row2"><span>Fri, 24 Oct · Downtown · Table 4</span><b>4 people</b></div><div class="row2"><span>Dishes ordered</span><b>9</b></div><div class="row2"><span>Total paid</span><b>$127</b></div>
        <div class="row2" style="padding-top:10px"><div class="stack">${['#0E6B2E','#3D7BD9','#C26A1B','#8E4FC4'].map((c,i)=>`<div class="av" style="background:${c}">${'OAMI'[i]}</div>`).join('')}</div><span>Same people will get the invite</span></div></div>
      <p class="hint" style="margin-top:16px">If a reservation is cancelled or moved, the pre-order session closes the same way — order details are no longer shown.</p></div></div>
      <div class="d-foot"><div class="f-main"><button class="secondary">My reservations</button><button class="primary" data-act="again" style="flex:1;min-width:0;padding:0 16px;white-space:nowrap">${I.repeat}&nbsp; Book again with same group</button></div></div>`;
  }},
};

const key = () => location.hash.slice(1)||'main';
function render(){
  const k=key(); S=fresh(); view='guest'; menuFor=null; MODE.live=true; $('#extra').innerHTML='';
  (SCREENS[k]||SCREENS.main).init?.();
  $('#drawer').innerHTML=(SCREENS[k]||SCREENS.main).render();
  $('#switch').innerHTML='<p>Prototype states · v3</p>'+Object.entries(SCREENS).map(([s,o])=>`<a href="#${s}" class="${s===k?'on':''}">${o.label}</a>`).join('');
}
const redraw = () => { $('#drawer').innerHTML=(SCREENS[key()]||SCREENS.main).render(); };

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.view){ view=t.dataset.view; redraw(); return; }
  if(t.dataset.menu){ menuFor = menuFor===t.dataset.menu ? null : t.dataset.menu; redraw(); return; }
  if(t.dataset.inc){ S.OWNER.items[t.dataset.inc].q++; redraw(); return; }
  if(t.dataset.dec){ const ix=+t.dataset.dec, it=S.OWNER.items[ix]; if(it.q>1){it.q--;redraw();} else { S.OWNER.items.splice(ix,1); redraw(); } return; }
  if(t.dataset.del){ S.OWNER.items.splice(+t.dataset.del,1); redraw(); toast('Dish removed'); return; }
  if(t.dataset.gdel){ const g=S.GUESTS.find(x=>x.id===t.dataset.gdel); g.items[+t.dataset.ix].removed=true; redraw(); return; }
  if(t.dataset.undoG){ const g=S.GUESTS.find(x=>x.id===t.dataset.undoG); g.items[+t.dataset.ix].removed=false; redraw(); return; }
  const a=t.dataset.act, n=t.dataset.n;
  if(a==='rmguest'){ S.GUESTS=S.GUESTS.filter(g=>g.id!==t.dataset.g); menuFor=null; redraw(); toast('Guest removed from the group'); return; }
  if(a==='auto'){ t.classList.toggle('off'); toast(t.classList.contains('off')?'Auto-remind off':'Auto-remind on — 16:30'); return; }
  if(a==='copy') toast('Invite link copied');
  if(a==='remind') toast(`Reminder sent to ${n}`);
  if(a==='ask') toast(`${n} asked to pick another dish`);
  if(a==='submit') { location.hash='locked'; }
  if(a==='pay') { location.hash='pay'; }
  if(a==='paylinks') toast('Payment links sent');
  if(a==='again') toast('New booking started with the same group');
  if(a==='ok'||a==='pick') toast(a==='ok'?'Got it':'Opening menu…');
});
addEventListener('hashchange',render); render();
</script>
</body>
</html>
